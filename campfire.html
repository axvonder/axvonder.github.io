<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Campfire · Alexander Vonderschmidt</title>
  <link rel="icon" href="assets/campfire/campfire.png">
  <style>
    :root { color-scheme: dark; font: 14px/1.4 system-ui, sans-serif; }
    body { margin: 0; background: #000; color: #e3e0dc; }
    /* Trim 24 pixels from the bottom padding and fit the remaining scene. */
    .scene-frame { position: fixed; inset: 0; margin: auto; width: min(100vw, calc(100dvh * 640 / 456)); height: min(100dvh, calc(100vw * 456 / 640)); overflow: hidden; }
    .scene { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    .controls { position: fixed; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; }
    .control { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: 22px; background: transparent; color: #fff; font: inherit; text-decoration: none; cursor: pointer; }
    .control:focus-visible { outline: 2px solid #d3c5f4; outline-offset: 4px; }
    .control svg { width: 24px; height: 24px; opacity: .35; }
    .mute-slash, [aria-pressed="true"] .sound-waves { display: none; }
    [aria-pressed="true"] .speaker-shape { transform: translateX(5.5px); }
    [aria-pressed="true"] .mute-slash { display: block; }
    [hidden] { display: none !important; }
  </style>
  <script src="campfire.js?v=20260925-1" defer></script>
</head>
<body>
  <main aria-label="Campfire">
    <div class="scene-frame">
      <img class="scene" src="assets/campfire/campfire-loop.gif" alt="Two travellers resting beside a campfire in a dark forest" width="640" height="480">
    </div>
    <audio id="campfire-music" src="assets/campfire/tristram.mp3" preload="auto" autoplay loop></audio>
    <nav class="controls" aria-label="Campfire controls">
      <a class="control back-link" href="index.html" aria-label="Back to home page">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m11 5-7 7 7 7M4 12h16"/></svg>
      </a>
      <button class="control" id="campfire-toggle" type="button" aria-label="Unmute Tristram music" aria-pressed="true" aria-controls="campfire-music" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path class="speaker-shape" d="m11 5-6 4H2v6h3l6 4Z"/>
          <path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>
          <path class="mute-slash" d="m6 4 12 16"/>
        </svg>
      </button>
    </nav>
  </main>
</body>
</html>
